<!DOCTYPE html>
<html lang="th" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูลสินค้า - เพิ่มข้อมูลสินค้า (product_insert_api)</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand d-flex align-items-center text-light fw-bold" href="index.html">
                <div class="brand-icon me-2">
                    <i class="bi bi-boxes"></i>
                </div>
                <div>
                    <span class="fs-5">Northwind Products</span>
                </div>
            </a>
            
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="bi bi-table me-1"></i> ดูรายการสินค้าทั้งหมด (Dashboard)
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                
                <!-- Card Container based on Slide 1 -->
                <div class="glass-card p-4 p-md-5">
                    
                    <!-- Header Banner (Slide 1) -->
                    <div class="text-center p-3 mb-4 rounded-3" style="background: linear-gradient(135deg, #059669 0%, #047857 100%);">
                        <h4 class="fw-bold text-white mb-1">
                            <i class="bi bi-box-seam me-2"></i> ระบบจัดการข้อมูลสินค้า
                        </h4>
                        <p class="text-white-50 small mb-0">
                            กรอกรายละเอียดสินค้าเพื่อส่งข้อมูลไปประมวลผลและบันทึกลงฐานข้อมูลที่ Server-Side
                        </p>
                    </div>

                    <!-- Insert Form -->
                    <form id="insertProductForm" novalidate>
                        <input type="hidden" name="action" value="insert">

                        <div class="row g-3">
                            <!-- ชื่อสินค้า (ProductName) * -->
                            <div class="col-12">
                                <label for="productName" class="form-label text-light fw-medium">
                                    ชื่อสินค้า (ProductName) <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-custom"><i class="bi bi-box-seam"></i></span>
                                    <input type="text" class="form-control form-control-custom" id="productName" name="ProductName" placeholder="เช่น Smart TV 55 นิ้ว 4K UHD" maxlength="30" required>
                                </div>
                                <div class="invalid-feedback">กรุณากรอกชื่อสินค้า (ไม่เกิน 30 ตัวอักษร)</div>
                            </div>

                            <!-- ผู้จัดจำหน่าย (SupplierID) * -->
                            <div class="col-12 col-md-6">
                                <label for="supplierId" class="form-label text-light fw-medium">
                                    ผู้จัดจำหน่าย (SupplierID) <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-custom"><i class="bi bi-building"></i></span>
                                    <select class="form-select form-select-custom" id="supplierId" name="SupplierID" required>
                                        <option value="">-- กำลังโหลด Supplier --</option>
                                    </select>
                                </div>
                                <div class="invalid-feedback">กรุณาเลือกผู้จัดจำหน่าย</div>
                            </div>

                            <!-- หมวดหมู่สินค้า (CatID) * -->
                            <div class="col-12 col-md-6">
                                <label for="catId" class="form-label text-light fw-medium">
                                    หมวดหมู่สินค้า (CatID) <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-custom"><i class="bi bi-grid-fill"></i></span>
                                    <select class="form-select form-select-custom" id="catId" name="CatID" required>
                                        <option value="">-- กำลังโหลด Category --</option>
                                    </select>
                                </div>
                                <div class="invalid-feedback">กรุณาเลือกหมวดหมู่สินค้า</div>
                            </div>

                            <!-- หน่วยนับ (Unit) * -->
                            <div class="col-12 col-md-4">
                                <label for="unit" class="form-label text-light fw-medium">
                                    หน่วยนับ (Unit) <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-custom"><i class="bi bi-hash"></i></span>
                                    <input type="text" class="form-control form-control-custom" id="unit" name="Unit" placeholder="เช่น ชิ้น, เครื่อง, กล่อง" maxlength="30" required>
                                </div>
                                <div class="invalid-feedback">กรุณากรอกหน่วยนับ</div>
                            </div>

                            <!-- ราคาสินค้า (Price) * -->
                            <div class="col-12 col-md-4">
                                <label for="price" class="form-label text-light fw-medium">
                                    ราคาสินค้า (Price) <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-custom">฿</span>
                                    <input type="number" step="0.01" min="0.01" class="form-control form-control-custom" id="price" name="Price" placeholder="0.00" required>
                                </div>
                                <div class="invalid-feedback">กรุณากรอกราคาที่มากกว่า 0</div>
                            </div>

                            <!-- จำนวนคงเหลือ (Quantity) * -->
                            <div class="col-12 col-md-4">
                                <label for="quantity" class="form-label text-light fw-medium">
                                    จำนวนคงเหลือ (Quantity) <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-custom"><i class="bi bi-stack"></i></span>
                                    <input type="number" min="0" class="form-control form-control-custom" id="quantity" name="Quantity" value="10" placeholder="10">
                                </div>
                            </div>
                        </div>

                        <!-- Buttons (Slide 1) -->
                        <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top border-secondary border-opacity-25">
                            <button type="reset" class="btn btn-outline-warning rounded-pill px-4 py-2" id="btnReset">
                                <i class="bi bi-arrow-counterclockwise me-1"></i> ล้างข้อมูล / เพิ่มใหม่
                            </button>
                            <button type="submit" class="btn btn-emerald-gradient rounded-pill px-4 py-2" id="btnSubmit">
                                <i class="bi bi-cloud-arrow-up-fill me-1"></i> บันทึกข้อมูลสินค้า
                            </button>
                        </div>
                    </form>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Reusable JS modules as taught in class (Slide 11, 12) -->
    <script src="js/form_template_reusable.js"></script>
    <script src="js/loaddata.js"></script>

    <!-- Slide 12 Inline JavaScript implementation -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // ตรวจสอบว่าเปิดผ่าน file:// หรือไม่
            if (window.location.protocol === 'file:') {
                Swal.fire({
                    icon: 'warning',
                    title: 'คำแนะนำการเปิดใช้งาน',
                    html: `คุณกำลังเปิดไฟล์ผ่าน <code>file:///</code> ซึ่งไม่สามารถรัน PHP และ API ได้<br><br>กรุณาเปิดผ่าน Web Server ในเบราว์เซอร์ที่:<br><a href="http://localhost/CPE66/Projack/product_insert_api.html" target="_blank" class="btn btn-primary mt-2">http://localhost/CPE66/Projack/product_insert_api.html</a>`,
                    background: '#1e293b',
                    color: '#f8fafc',
                    allowOutsideClick: false
                });
                return;
            }

            // โหลด Category และ Supplier เข้า select options (ตาม Slide 12)
            loadSelectOptions('api/categories', 'catId', '-- เลือก Category --');
            loadSelectOptions('api/suppliers', 'supplierId', '-- เลือก Supplier --');

            const form = document.getElementById('insertProductForm');
            const btnSubmit = document.getElementById('btnSubmit');

            // จัดการเมื่อกด Submit
            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                FormValidator.clearErrors(form);

                const formData = {
                    ProductName: document.getElementById('productName').value.trim(),
                    SupplierID: document.getElementById('supplierId').value,
                    CatID: document.getElementById('catId').value,
                    Unit: document.getElementById('unit').value.trim(),
                    Price: document.getElementById('price').value.trim(),
                    Quantity: document.getElementById('quantity').value.trim(),
                    action: 'insert'
                };

                // ตรวจสอบความถูกต้อง Client-side (Slide 1)
                const validation = FormValidator.validateProductForm(formData);
                if (!validation.isValid) {
                    for (const [field, msg] of Object.entries(validation.errors)) {
                        let elem = null;
                        if (field === 'ProductName') elem = document.getElementById('productName');
                        else if (field === 'SupplierID') elem = document.getElementById('supplierId');
                        else if (field === 'CatID') elem = document.getElementById('catId');
                        else if (field === 'Unit') elem = document.getElementById('unit');
                        else if (field === 'Price') elem = document.getElementById('price');

                        if (elem) FormValidator.showFieldError(elem, msg);
                    }
                    Notify.warning('ข้อมูลไม่ถูกต้อง', 'กรุณากรอกข้อมูลในช่องที่มีเครื่องหมาย * ให้ครบถ้วน');
                    return;
                }

                btnSubmit.disabled = true;
                btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> กำลังบันทึกข้อมูล...`;

                try {
                    // ส่งข้อมูลไปยัง process_product.php (Slide 2-7) หรือ api/products
                    const response = await fetch('process_product.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
                        },
                        body: new URLSearchParams(formData).toString()
                    });

                    const result = await response.json();

                    if (result && result.success) {
                        Notify.success('บันทึกสำเร็จ!', result.message || 'บันทึกข้อมูลสินค้าลงฐานข้อมูลเรียบร้อยแล้ว (ID: ' + (result.id || '') + ')');
                        form.reset();
                        document.getElementById('quantity').value = '10';
                    } else {
                        Notify.error('บันทึกไม่สำเร็จ', result.message || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                    }
                } catch (error) {
                    console.error('Error submitting form:', error);
                    Notify.error('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์เพื่อบันทึกข้อมูลได้');
                } finally {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = `<i class="bi bi-cloud-arrow-up-fill me-1"></i> บันทึกข้อมูลสินค้า`;
                }
            });
        });
    </script>
</body>
</html>
